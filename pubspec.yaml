name: biochar_simulator
description: "Simulador de filtración de agua BIOCHAR con modelo de Monte Carlo"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.0 #'>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0 #^0.68.0
  provider: ^6.1.5+1 #^6.1.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 #^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.jpeg" 
  min_sdk_android: 21

flutter:

  uses-material-design: true

